spring:
  application:
    name: spring-security-e11
    version: 1.0.0

  datasource:
    url: ${DB_URL}
    username: ${DB_USER_NAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:none}
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: ture
    database: postgresql


  flyway:
    baseline-on-migrate: true
    enabled: true
    user: ${DB_USER_NAME}
    password: ${DB_PASSWORD}
    baseline-description: "init"
    baseline-version: 0

